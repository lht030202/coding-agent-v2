[project]
name = "coding-agent-v2"
version = "0.2.0"
description = "A LangGraph coding agent with native function calling, test-driven verification and a reproducible evaluation harness."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
cc-agent = "cc_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
